name: lyre
description: "Lyre - Music sharing, downloading, and playback application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0-288.0.dev <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite_common_ffi: ^2.3.4
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  just_audio: ^0.9.43
  http: ^1.3.0
  pointycastle: ^3.9.1
  crypto: ^3.0.6
  file_picker: ^8.3.7
  provider: ^6.1.5
  window_manager: ^0.4.3
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
